# WS12 / บทที่ 16: ใช้บน Production (AWS EC2) — ดึง Image สำเร็จรูปจาก Docker Hub
# ดำเนินการผ่าน CI/CD Pipeline (cd.yml)

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  INTERNAL_GRPC_TOKEN: ${INTERNAL_GRPC_TOKEN:?INTERNAL_GRPC_TOKEN is required}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shop.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  CORS_ORIGIN: ${CORS_ORIGIN:-*}

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      retries: 10

  migrate:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/ecommerce-migrate:${IMAGE_TAG:-latest}
    environment: *app-env
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  inventory:
    image: ${DOCKERHUB_USERNAME}/ecommerce-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ['node', 'src/grpc/inventory.server.js']
    environment: *app-env
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  # บทที่ 16: ไม่เปิดพอร์ตสู่ภายนอกแล้ว ผู้ใช้เข้าผ่าน Nginx (service web) เท่านั้น
  api:
    image: ${DOCKERHUB_USERNAME}/ecommerce-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: 8080
      INVENTORY_GRPC_URL: inventory:50051
      # มี Reverse proxy (Nginx) อยู่หน้า API 1 ชั้น -> ใช้ IP จาก X-Forwarded-For ที่ Nginx ใส่ให้
      # ปลอดภัยเพราะ API ไม่ได้เปิดพอร์ตสู่ภายนอก ทุก Request ต้องผ่าน Nginx ซึ่งเขียนทับ Header นี้เสมอ
      TRUST_PROXY_HOPS: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    image: ${DOCKERHUB_USERNAME}/ecommerce-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 2

  # บทที่ 16: Nginx เสิร์ฟหน้าเว็บ React และ Reverse proxy ไปที่ api — ประตูเดียวสู่ภายนอก (พอร์ต 80)
  web:
    image: ${DOCKERHUB_USERNAME}/ecommerce-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  rabbitdata: