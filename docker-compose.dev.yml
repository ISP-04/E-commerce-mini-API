# สำหรับพัฒนาบนเครื่องตัวเองเท่านั้น: รันฐานข้อมูลใน Docker แล้วรัน API ด้วย `npm run dev`
#   docker compose -f docker-compose.dev.yml up -d
# พอร์ตผูกกับ 127.0.0.1 เท่านั้น (เครื่องอื่นในวง LAN เข้าไม่ได้)
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
 
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
 
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672' # หน้าจัดการ http://localhost:15672 (guest/guest)
 
volumes:
  pgdata-dev:
