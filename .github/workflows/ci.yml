# WS11 กิจกรรมที่ 1: CI — ตรวจทุก Pull Request ก่อนเข้า main (Lint + Unit + Integration test จริงกับ Postgres)
name: CI
 
on:
  pull_request:
    branches: [main]
  workflow_call: # ให้ cd.yml เรียกใช้ซ้ำก่อน Deploy
 
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
 
jobs:
  build-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
 
    # Service containers: ได้ Postgres/Redis จริงสำหรับ Integration test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shop -d shop_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
 
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://shop:shop@localhost:5432/shop_test
      JWT_SECRET: ci-test-secret-not-used-in-production-0123456789
      REDIS_URL: redis://localhost:6379
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
 
      - name: Install dependencies
        run: npm ci
 
      - name: Generate Prisma Client
        run: npx prisma generate
 
      - name: Lint
        run: npm run lint
 
      - name: Apply database migrations
        run: npx prisma migrate deploy
 
      - name: Run tests with coverage
        run: npm run test:coverage
 
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
 
  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Worker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
