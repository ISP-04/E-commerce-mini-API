# WS11 กิจกรรมที่ 3 + WS12 กิจกรรมที่ 3: CD — Build/Push Image ขึ้น Docker Hub แล้ว Deploy ขึ้น Cloud server
# Secrets ที่ต้องตั้งใน GitHub (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, SSH_PRIVATE_KEY, SERVER_HOST, SERVER_USER
name: CD
 
on:
  push:
    branches: [main]
  workflow_dispatch:
 
concurrency:
  group: cd-production
  cancel-in-progress: false # ห้ามยกเลิก Deploy ที่กำลังทำอยู่กลางคัน
 
jobs:
  test:
    # ทดสอบซ้ำก่อนปล่อยของ (กันกรณี push ตรงเข้า main โดยไม่ผ่าน PR)
    uses: ./.github/workflows/ci.yml
 
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
 
      - name: Build and push Migration image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: build
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-migrate:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-migrate:${{ github.sha }}
 
      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-worker:${{ github.sha }}
 
  deploy-to-server:
    name: Deploy to cloud server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/app
            # ใช้ tag ของ commit นี้ (ไม่ใช่ latest) -> rollback ได้ด้วยการเปลี่ยน IMAGE_TAG กลับเป็น sha เก่า
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
 
      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ secrets.SERVER_HOST }}/health"; then echo; echo "Deploy OK"; exit 0; fi
            echo "waiting for API... ($i/12)"; sleep 5
          done
          echo "Health check failed"; exit 1
