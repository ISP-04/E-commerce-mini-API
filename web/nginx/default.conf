# Nginx หน้าที่ 2 อย่าง: (1) เสิร์ฟไฟล์ React ที่ build แล้ว (2) Reverse proxy ส่ง /api, /ws ไปที่ Service "api"
# ผู้ใช้เห็นทุกอย่างมาจาก Origin เดียว (http://<IP>/) จึงไม่ต้องเปิด CORS และ API ไม่ต้องเปิดพอร์ตสู่ภายนอก
 
# WebSocket: ถ้า Client ขอ Upgrade ให้ส่ง Connection: upgrade ต่อ ถ้าไม่ขอให้ปิดตามปกติ
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
 
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off; # ไม่บอกเวอร์ชัน Nginx ใน Header
 
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
 
  # DNS ภายในของ Docker: ถาม IP ของ "api" ใหม่ทุก 10 วินาที
  # ถ้าเขียน proxy_pass http://api:8080 ตรง ๆ Nginx จะจำ IP ไว้ตอนเริ่ม พอ Deploy แล้ว Container api ได้ IP ใหม่จะเจอ 502
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8080;
 
  # ค่าเริ่มต้นของทุก location ที่ proxy (location ไหนตั้ง proxy_set_header เองจะไม่รับค่าชุดนี้)
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # เขียนทับด้วย IP จริงของผู้เรียก ไม่ต่อท้ายค่าที่ Client ส่งมา -> ปลอม X-Forwarded-For หลบ Rate limit ไม่ได้
  # (API ตั้ง TRUST_PROXY_HOPS=1 ให้เชื่อ Proxy 1 ชั้นนี้)
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
 
  location /api/ {
    proxy_pass $api_upstream;
  }
 
  location = /health {
    proxy_pass $api_upstream;
  }
 
  location /api-docs {
    proxy_pass $api_upstream;
  }
 
  location = /openapi.json {
    proxy_pass $api_upstream;
  }
 
  # หน้าทดสอบ WebSocket จากบทที่ 09
  location ~ ^/realtime\.(html|js|css)$ {
    proxy_pass $api_upstream;
  }
 
  location = /ws {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s; # API ส่ง ping ทุก 30 วินาที จึงไม่ถูกตัดเพราะเงียบนาน
    access_log off; # URL มี ?token=<JWT> ห้ามเขียนลง Log
  }
 
  # Health check ของตัว Nginx เอง (ไม่ขึ้นกับ API)
  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
 
  # ไฟล์ใน /assets มี Hash ในชื่อ (index-C1cWIL_0.js) เนื้อหาเปลี่ยนชื่อก็เปลี่ยน จึงให้ Browser Cache ได้ 1 ปี
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
 
  # SPA fallback: URL ที่ไม่ใช่ไฟล์จริง (เช่น /orders/123) ส่ง index.html ให้ React Router จัดการ
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache"; # index.html ต้องตรวจเวอร์ชันใหม่ทุกครั้ง จะได้โหลด JS ชุดล่าสุดหลัง Deploy
    try_files $uri $uri/ /index.html;
  }
}
