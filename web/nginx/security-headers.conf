# Security headers สำหรับหน้าเว็บ (include ในทุก location ที่ใช้ add_header
# เพราะ Nginx จะไม่สืบทอด add_header จากระดับบน ถ้า location นั้นมี add_header ของตัวเอง)
# CSP: อนุญาตสคริปต์/สไตล์จาก Origin ตัวเองเท่านั้น ลดความเสียหายถ้ามีช่องโหว่ XSS (Token อยู่ใน localStorage)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
